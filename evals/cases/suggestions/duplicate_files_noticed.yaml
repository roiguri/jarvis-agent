description: Two files on the same subject are pointed out.
kind: suggestions
time: "22:00"
files:
  running_plan.md: |
    # Running plan
    - Easy runs Sunday and Tuesday, 5 km.
    - Long run Friday morning, building to 12 km.
  running_notes.md: |
    # Running notes
    - Long run on Fridays, currently 10 km.
    - Easy 5 km on Sunday and Tuesday.
  MEMORY.md: |
    # Memory index

    - book_list.md — books to read, with status
    - running_plan.md — the running plan
    - running_notes.md — notes on running
    - heartbeat/ — notes files for each heartbeat task
conversation:
  - {time: "07:00", owner: "did a 10 km long run this morning, felt great", jarvis: "Great run — 10 km logged."}
expect:
  sends: 1
  message_matches: ["running_(plan|notes)\\.md.*running_(plan|notes)\\.md|merge|combine"]
