description: Weekly review notices a memory file whose contents clearly belong in another home (cookbook) and suggests moving it.
kind: suggestions_weekly
time: "09:00"
files:
  dream_preferences.md: |
    - Keep book_list.md as a standalone memory file; do not suggest moving it to collections.
  family_recipes.md: |
    # Family Recipes

    ## Red Lentil Soup
    - Ingredients: 200g red lentils, 1 onion, 2 carrots, 1 tsp cumin, 1L vegetable broth, olive oil.
    - Steps: Sauté diced onion and carrots in olive oil for 5 min, add cumin and lentils, pour broth, simmer 25 min, blend smooth.

    ## Shakshuka
    - Ingredients: 4 eggs, 1 can crushed tomatoes, 1 red pepper, 2 cloves garlic, 1 tsp paprika, cumin.
    - Steps: Cook pepper and garlic until soft, add tomatoes and spices, simmer 10 min, crack eggs on top, cover 5 min.
  MEMORY.md: |
    # Memory index

    - book_list.md — books to read, with status
    - family_recipes.md — saved family recipes with ingredients and steps
    - heartbeat/ — notes files for each heartbeat task
    - daily/ — daily logs
daily_logs:
  - days_ago: 2
    text: |
      # Daily Log

      ## Conversations
      - Roi asked for the weather in Tel Aviv.
expect:
  sends: 1
  max_suggestions: 5
  message_contains: ["family_recipes.md", "cookbook"]
