description: Weekly review notices USER.md exceeding the 4,000-char target and suggests trimming or moving verbose entries.
kind: suggestions_weekly
time: "09:00"
files:
  USER.md: |
    # User profile (synthetic, for evals)

    - Lives in Tel Aviv. Works Sunday to Thursday.
    - Training: CrossFit twice a week, plus a 100,000-step challenge this month (target 7,500 steps a day).
    - Prefers short messages; one nudge is enough, repeated reminders are annoying.

    ## Kitchen & Coffee Notes (accumulated verbose log)
    - January 2025: Tried light-roast Ethiopian beans from a local roaster in Florentin. Ground at setting 14 on the burr grinder, brewed 18g in / 36g out in 29 seconds. Liked the floral notes, though it was slightly acidic in the morning before breakfast.
    - February 2025: Switched to a medium-roast Colombian bag from Dizengoff. Ground at setting 12, brewed 18g in / 38g out in 27 seconds. Good crema, worked nicely as a flat white with oat milk on rainy weekends.
    - March 2025: Tested a washed Kenyan pour-over using a V60 with 15g coffee and 250ml water at 93C, bloom 45 seconds, total drawdown 2m45s. Clean finish, slightly bright, enjoyed while reading on the balcony.
    - April 2025: Bought a replacement silicone grouphead gasket and descaled the espresso machine with citric acid solution. Also cleaned the steam wand tip and soaked the dispersion screen for twenty minutes.
    - May 2025: Experimented with cold brew concentrate (1:5 ratio, coarse grind, 16 hours in the fridge, filtered through a paper filter). Diluted 1:1 with cold water and ice on hot afternoons.
    - June 2025: Compared two different oat milk brands for microfoam texture; the barista edition steamed much more smoothly without splitting at 60C.

    ## Home Office Desk Setup History (accumulated verbose log)
    - Monitor arm mounted on the left side of the 140cm oak desk to clear space for a notebook and coffee mug. Cable tray bolted underneath with Velcro ties routing USB-C power, DisplayPort, and Ethernet cleanly down the back leg.
    - Tried a split ergonomic keyboard for two weeks in spring 2025; liked the shoulder posture, missed the compact arrow cluster, switched back to a 75% tactile mechanical board with silent switches for late-night calls.
    - Desk lamp set to warm 3200K after 19:00 to reduce eye strain; webcam mounted on top of the main display with a small clip-on key light diffused through frosted plastic.
    - Replaced chair casters with rollerblade-style polyurethane wheels so the chair rolls quietly over the tile floor without scratching or catching on the rug edge.

    ## Miscellaneous Travel Packing Reminders (accumulated verbose log)
    - Always pack a compact 65W GaN dual-port USB-C charger, two braided 2m cables, an EU/UK universal adapter, a small zip pouch with earplugs and an eye mask, and a collapsible water bottle for airport security.
    - Keep passport photo page scan and travel insurance policy number accessible offline before boarding; download offline maps for the destination city and transit lines the night before departure.
    - For carry-on-only trips up to five days, use the 35L backpack with two medium packing cubes (shirts/underwear in one, trousers/layers in the other), lightweight rain shell rolled at the top, and trail runners worn on the flight.
    - Remember to bring a spare luggage strap, a microfiber cloth for sunglasses and laptop screen, travel-size sunscreen, and a small foldable tote bag for groceries or day trips once at the hotel.

    ## Weekend Errands & Neighborhood Notes (accumulated verbose log)
    - Hardware store on King George closes early on Fridays around 13:30; best to go Thursday afternoon or Friday before 11:00 if picking up fasteners, wall anchors, or paint rollers.
    - Tailoring shop near Rabin Square usually needs three business days for trouser hemming and takes cash or Bit; call ahead before dropping off winter jackets.
    - Local bakery on Ibn Gabirol pulls sourdough loaves out of the oven at 08:15 and usually sells out of the seeded rye by 10:30 on Fridays.
    - Dry cleaner around the corner is closed on Tuesdays and offers next-day pressing for dress shirts if dropped off before 10:00 in the morning.
    - Bicycle mechanic near the park does quick brake adjustments on walk-ins during weekday mornings, while full tune-ups and wheel truing require booking a slot two days ahead.
    - Post office pickup locker at the corner supermarket holds parcels for 72 hours after SMS arrival notice; bring the six-digit code from the message.
daily_logs:
  - days_ago: 2
    text: |
      # Daily Log

      ## Conversations
      - Roi asked for a quick weather check for the weekend.
expect:
  sends: 1
  max_suggestions: 5
  message_contains: ["USER.md"]
  message_matches: ["4,?000|trim|bloat|size|move|shorten|extract|condense"]
