    # User Profile
    - Name: Roi
    - Gym: CrossFit Neve Tzedek (Arbox, WOD track; evening slots 18:00-20:00)
message: "What CrossFit classes are available tomorrow evening?"
stubs:
  fetch_weekly_gym_schedule: |
    Tomorrow evening (Neve Tzedek — WOD track):
    - 18:00 WOD (5 spots left) — Back Squat 5x5 + 12-min AMRAP (wall balls, box jumps)
    - 19:00 WOD (2 spots left) — Back Squat 5x5 + 12-min AMRAP (wall balls, box jumps) + Ron
