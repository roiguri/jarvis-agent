description: The daily-log task writes today's file and never messages.
kind: tick
time: "14:00"
due: [daily-log]
chat:
  - {time: "10:15", role: user, text: "add The Overstory to my reading list"}
  - {time: "10:15", role: assistant, text: "Added The Overstory to your book list."}
expect:
  ack: {notify: false, acted_tasks: [daily-log]}
  called_with:
    - {tool: write_memory, args: {filename: "daily/daily_"}}
  sends: 0
